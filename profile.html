<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARI - Profile</title>
  <link rel="stylesheet" href="css/style.css?v=12.0">
  <link rel="stylesheet" href="css/extra.css?v=12.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Topbar Link at Store Name Styling */
    .topbar-store {
      text-decoration: none;
      color: #ffffff !important; /* Puti para litaw sa dark background */
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #topbarStoreName {
      color: #ffffff !important;
      font-weight: 700;
      font-size: 0.95rem;
    }

    /* Topbar Avatar Circle Container */
    .topbar-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b382b;
      font-size: 0.95rem;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Main Center Avatar Box */
    .avatar-upload-box {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #4d774e;
      border: 3px solid #9dc88d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #ffffff;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      margin: 0 auto;
      transition: opacity 0.2s ease;
    }
    
    .avatar-upload-box:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body class="app-page">

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a href="homepage.html" class="sidebar-logo">Sari</a>
      </div>

      <nav class="sidebar-nav">
        <a href="homepage.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-house"></i></span>
          <span class="sidebar-label">Home</span>
        </a>
        <a href="inventory.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-box"></i></span>
          <span class="sidebar-label">Inventory</span>
        </a>
        <a href="checkout.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-cash-register"></i></span>
          <span class="sidebar-label">Checkout</span>
        </a>
        <a href="dashboard.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-chart-pie"></i></span>
          <span class="sidebar-label">Dashboard</span>
        </a>
        <a href="credit-ledger.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-money-check-dollar"></i></span>
          <span class="sidebar-label">Credit Ledger</span>
        </a>
        <a href="transactions.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-receipt"></i></span>
          <span class="sidebar-label">Transactions</span>
        </a>
        <a href="settings.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-gear"></i></span>
          <span class="sidebar-label">Settings</span>
        </a>
        <a href="profile.html" class="sidebar-link active">
          <span class="sidebar-icon"><i class="fa-solid fa-user"></i></span>
          <span class="sidebar-label">My Profile</span>
        </a>
      </nav>

      <div class="sidebar-spacer"></div>

      <button id="logoutBtn" class="sidebar-logout" style="background:none; border:none; cursor:pointer; width:100%; text-align:left; color:inherit;">
        <span class="sidebar-icon"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
        <span class="sidebar-label">Log Out</span>
      </button>
    </aside>

    <main class="main-content">

      <div class="topbar-row">
        <div class="topbar">
          <div class="topbar-left">
            <button class="topbar-home-btn" type="button" onclick="window.location.href='profile.html'">Store Profile</button>
          </div>
          <a class="topbar-store" id="profileBtn" href="profile.html">
            <span class="topbar-avatar" id="avatarContainer">
              <i class="fa-solid fa-user"></i>
            </span>
            <span id="topbarStoreName">Loading...</span>
          </a>
        </div>
      </div>

      <div class="inv-form-card" style="max-width: 600px; margin: 20px auto; background: #1b382b; color: #ffffff; border-radius: 20px; padding: 30px;">
        <h2 style="text-align: center; margin-bottom: 20px; font-weight: 800;">Store Profile & Details</h2>

        <p style="text-align: center; font-size: 0.85rem; color: #a3b899; margin-bottom: 15px;">Profile Picture (Click to Change)</p>
        
        <div style="display: flex; justify-content: center; margin-bottom: 25px;">
          <input type="file" id="profileImageFile" accept="image/*" style="display: none;">
          <div class="avatar-upload-box" id="avatarBox">
            <i class="fa-solid fa-user"></i>
          </div>
        </div>

        <form id="profileForm">
          <div class="inv-form-group" style="margin-bottom: 15px;">
            <label class="inv-form-label" style="color: #ffffff; font-weight: 700; margin-bottom: 5px; display: block;">Owner Name</label>
            <input type="text" id="inputFullName" class="inv-form-input" placeholder="Owner Name" style="width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: 600;">
          </div>

          <div class="inv-form-group" style="margin-bottom: 15px;">
            <label class="inv-form-label" style="color: #ffffff; font-weight: 700; margin-bottom: 5px; display: block;">Store Name</label>
            <input type="text" id="inputStoreName" class="inv-form-input" placeholder="Store Name" style="width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: 600;">
          </div>

          <div class="inv-form-group" style="margin-bottom: 25px;">
            <label class="inv-form-label" style="color: #ffffff; font-weight: 700; margin-bottom: 5px; display: block;">Email Address</label>
            <input type="email" id="valEmail" class="inv-form-input" placeholder="Email Address" disabled style="width: 100%; padding: 12px; border-radius: 10px; border: none; background: #e2e8f0; color: #475569; font-weight: 600;">
          </div>

          <button type="submit" id="saveProfileBtn" class="inv-submit-btn" style="width: 100%; background: #9dc88d; color: #14301f; border: none; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer;">
            <i class="fa-solid fa-floppy-disk"></i> Save Changes
          </button>
        </form>
      </div>

    </main>
  </div>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
